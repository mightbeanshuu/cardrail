spring:
  application:
    name: cardrail-switch
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/cardrail
    username: mac
    password: ""
    hikari:
      maximum-pool-size: 20
  flyway:
    clean-disabled: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # Fail fast so a Redis outage degrades the velocity check instead of stalling authorizations.
      timeout: 200ms
      connect-timeout: 200ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Redis being down degrades velocity checks but the switch keeps authorizing, so it must not
        # take the instance out of the load balancer.
        readiness:
          include: readinessState, db
  metrics:
    tags:
      application: cardrail-switch

logging:
  pattern:
    correlation: "[cid=%X{correlationId:-} rrn=%X{rrn:-} stan=%X{stan:-} auth=%X{authorizationId:-}] "

springdoc:
  api-docs:
    path: /v3/api-docs

cardrail:
  scheduling:
    enabled: true
  # vault (default): cardrail-vault, encrypted PANs in vault_record, keys from cardrail.vault.*
  # dev: keyless HMAC tokens, nothing stored, cannot be detokenized
  tokenizer: vault
  dev:
    tokenizer:
      key: ${CARDRAIL_DEV_TOKENIZER_KEY:dev-only-tokenizer-key-change-me-0123456789}
  vault:
    token-bin: "999999"
    # keks and blind-index-key have no default: outside the dev and test profiles they must be
    # supplied (e.g. CARDRAIL_VAULT_KEKS_0_ID, CARDRAIL_VAULT_KEKS_0_KEY, CARDRAIL_VAULT_KEKS_0_STATUS,
    # CARDRAIL_VAULT_BLIND_INDEX_KEY), or the switch refuses to start.
  iso:
    enabled: true
    port: 8583
    # Loopback by default, so exposing the ISO port on a network interface is a deliberate choice.
    bind-address: 127.0.0.1
    max-connections: 1024
    max-in-flight-per-connection: 64
    request-timeout: 5s
    idle-timeout: 5m
    drain-timeout: 10s
  # Empty: every card number is processed. The demo profile lists its test cards.
  cards:
    allowed-prefixes: []
  web:
    allowed-origins:
      - http://localhost:4200
    rate-limit:
      enabled: false
      burst: 20
      requests-per-minute: 60
  duplicates:
    payload-hash-key: ${CARDRAIL_PAYLOAD_HASH_KEY:dev-only-payload-hash-key-change-me-0123456789}
    in-flight-wait: 3s
    poll-interval: 25ms
  risk:
    currencies:
      "356":                                # INR
        max-transaction-minor: 20000000     # 2,00,000.00
        velocity-max-amount-minor: 50000000 # 5,00,000.00 per window
      "840":                                # USD
        max-transaction-minor: 500000       # 5,000.00
        velocity-max-amount-minor: 1000000  # 10,000.00 per window
    velocity:
      window: 1h
      max-count: 20
      degraded-ratio: 0.5
  issuer:
    resilience:
      timeout: 1500ms
      sliding-window-size: 20
      minimum-number-of-calls: 10
      failure-rate-threshold: 50
      wait-in-open-state: 30s
      permitted-calls-in-half-open: 3
    sim:
      latency: 0ms
      failure-rate: 0.0
  holds:
    expiry-days: 7
    batch-size: 100
    abandoned-after: 2m
    sweep-interval: 5m
  outbox:
    publisher: log
    batch-size: 100
    max-attempts: 10
    topic-prefix: "cardrail."
    send-timeout: 5s
    topic-partitions: 3
    topic-replicas: 1
    poll-interval: 1s
    http:
      event-types:
        - authorization.captured
        - authorization.reversed

---
# DEVELOPMENT KEYS, NOT SECRET. They are published in this repository so that dev and test tokens
# stay stable across restarts. The switch refuses to start with these values in any other profile.
spring:
  config:
    activate:
      on-profile: "dev | test"
cardrail:
  vault:
    keks:
      - id: dev-kek-v1
        key: /yebDAI+0Vw595CGDR5vX5wY8hhwVwcfQR2P0bntk0o=
        status: ACTIVE
    blind-index-key: L4uH8gYvEp8uhse9xA2PiO4mf6fD1YBVPo+NgEwv2N8=

---
# The public demo on Render's free tier (docs/DEPLOY.md): one 512 MB instance, HTTP only, no broker.
# Every secret comes from the environment; the vault keys are CARDRAIL_VAULT_KEKS_0_* and
# CARDRAIL_VAULT_BLIND_INDEX_KEY as in any other deployment, and the development keys are refused.
spring:
  config:
    activate:
      on-profile: demo
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    # Clearing shares the database and lives in its own schema.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=switch
    hikari:
      maximum-pool-size: 5
  flyway:
    schemas: switch
  lifecycle:
    # Render sends SIGKILL 30 s after SIGTERM.
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health, info
      # The console pings health to wake a sleeping instance.
      cors:
        allowed-origins: https://cardrail-demo.vercel.app,http://localhost:4200
        allowed-methods: GET
cardrail:
  iso:
    enabled: false
  issuer:
    sim:
      # The fault settings are shared by every visitor, so one visitor's outage ends by itself.
      reset-after: 2m
  cards:
    # Published test card numbers only; anything else is answered 14 and never stored.
    allowed-prefixes:
      - "5555555555554444"
      - "5200828282828210"
      - "2223003122003222"
      - "5105105105105100"
      - "5425233430109903"
      - "2223000048410010"   # no account: the issuer answers 14
  risk:
    velocity:
      # Every visitor shares the same six cards.
      max-count: 200
  outbox:
    publisher: http
    batch-size: 20
    # The free clearing instance sleeps when idle and takes a while to wake, so the first sends of a
    # burst time out; enough attempts keep those events until it answers.
    send-timeout: 15s
    max-attempts: 500
    http:
      secret: ${CARDRAIL_EVENTS_HMAC_SECRET}
  web:
    allowed-origins:
      - https://cardrail-demo.vercel.app
      - http://localhost:4200
    rate-limit:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: json
logging:
  structured:
    format:
      console: ecs
    json:
      customizer: dev.cardrail.sw.logging.PanMaskingJsonMembersCustomizer
