spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cardrail_test
    hikari:
      maximum-pool-size: 30
  flyway:
    clean-disabled: false
  data:
    redis:
      database: 15

cardrail:
  scheduling:
    enabled: false
  outbox:
    publisher: kafka
  risk:
    velocity:
      max-count: 1000
  issuer:
    resilience:
      timeout: 1500ms
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-in-open-state: 60s
      permitted-calls-in-half-open: 1

logging:
  level:
    org.apache.kafka: WARN
    kafka: WARN
    org.apache.zookeeper: WARN
    state.change.logger: WARN
